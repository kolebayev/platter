name: CI

# Pushes to main only. There is deliberately no `pull_request:` trigger.
#
# Nothing here is deployed — the artifact is a DMG somebody downloads, so a
# pull request has no environment to protect and a red tick on it blocks
# nothing that a red tick on main would not catch first. What it does cost is
# real: every job needs a macos-14 runner to compile against libgpod, and a
# pull request that gets pushed to five times pays for that five times over.
#
# So main is the only branch with a verdict. Work accumulates on dev, the
# dev -> main pull request merges unchecked, and the suite runs on the merge
# commit — which is the commit a bisect lands on anyway. The trade is that a
# break is found after it is on main rather than before; run `npm test`,
# `npm run typecheck`, `cargo fmt --check`, `cargo clippy` and `cargo test`
# locally before promoting, because nothing upstream will.
on:
  push:
    branches: [master, main]
  # Manual re-run, for when a run needs repeating without an empty commit.
  workflow_dispatch:

# Superseded main pushes are NOT worth cancelling: two merges landing back to
# back would otherwise leave the first merge commit with no verdict at all,
# and that commit is the one a bisect lands on later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that needs neither libgpod nor a Rust compile. This is the job
  # that must stay fast and always green.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds the real production bundle, which is also what catches a broken
      # dynamic import in the lazy-loaded tabs.
      - run: npm run build

  # cargo fmt parses without compiling, so it needs no system libraries at all.
  #
  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path tauri-src/Cargo.toml --check

  # Compiling the backend needs libgpod, which is NOT in Homebrew — it is built
  # from source (the README expects it at ~/.local). Building it here takes a
  # few minutes, so the result is cached on the libgpod version and the job only
  # pays that cost when the cache misses.
  #
  rust:
    runs-on: macos-14
    env:
      LIBGPOD_VERSION: "0.8.3"
      LIBGPOD_SHA256: "638a7959d04e95f1e62abad02bd33702e4e8dfef98485ac7d9d50395c37e955d"
      LIBGPOD_PREFIX: ${{ github.workspace }}/.libgpod
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-src
      - name: Install build dependencies
        # ffmpeg is here only so tauri-build finds the externalBin sidecars it
        # refuses to build without. This is Homebrew's GPL build and the step
        # below stages it with ALLOW_GPL_FFMPEG=1 — sound because this job
        # compiles and tests and never produces a DMG. The build that ships
        # gets its own LGPL ffmpeg in build-dmg.yml.
        run: brew install glib gdk-pixbuf libplist sqlite pkg-config autoconf automake libtool gettext intltool ffmpeg

      - name: Cache libgpod
        id: libgpod-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBGPOD_PREFIX }}
          key: libgpod-${{ env.LIBGPOD_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build libgpod from source
        if: steps.libgpod-cache.outputs.cache-hit != 'true'
        # See build-dmg.yml for why this is Debian's mirror and not
        # SourceForge, and why the hash is checked.
        run: |
          set -euo pipefail
          curl -fsSL "https://deb.debian.org/debian/pool/main/libg/libgpod/libgpod_${LIBGPOD_VERSION}.orig.tar.bz2" -o libgpod.tar.bz2
          echo "${LIBGPOD_SHA256}  libgpod.tar.bz2" | shasum -a 256 --check --status
          tar xf libgpod.tar.bz2
          cd "libgpod-${LIBGPOD_VERSION}"
          # See build-dmg.yml for both of these: Homebrew's perl has no
          # XML::Parser where macOS's does, and Homebrew's libplist answers to
          # `libplist-2.0` where libgpod asks for `libplist`.
          if /usr/bin/perl -e 'require XML::Parser' 2>/dev/null; then
            export INTLTOOL_PERL=/usr/bin/perl
          else
            brew install cpanminus
            sudo cpanm --notest XML::Parser
          fi
          shim="$PWD/.pc-shim"
          mkdir -p "$shim"
          {
            echo "Name: libplist"
            echo "Description: Maps libgpod's libplist requirement onto libplist-2.0"
            echo "Version: $(pkg-config --modversion libplist-2.0)"
            echo "Requires: libplist-2.0"
          } > "$shim/libplist.pc"
          export PKG_CONFIG_PATH="$shim:${PKG_CONFIG_PATH:-}"
          ./configure --prefix="$LIBGPOD_PREFIX" \
            --disable-udev --disable-gtk-doc --without-hal --disable-pygobject --disable-mono
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Stage ffmpeg sidecars
        # binaries/ is gitignored, and tauri.conf.json declares them as
        # externalBin, so a build fails without this step.
        run: ALLOW_GPL_FFMPEG=1 ./scripts/stage-ffmpeg.sh

      - name: Clippy
        run: cargo clippy --manifest-path tauri-src/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path tauri-src/Cargo.toml

  # A DMG off every push to main, downloadable from the run's Artifacts. It is
  # the same workflow a tagged release runs, so what a tester installs between
  # releases is built the way the release will be — LGPL ffmpeg included, since
  # a build handed to someone else is a build that ships.
  #
  # Gated on the fast job so a failing typecheck costs seconds rather than the
  # 20 minutes this takes.
  dmg:
    needs: frontend
    uses: ./.github/workflows/build-dmg.yml
    with:
      artifact-name: platter-dmg-${{ github.sha }}
