# The one place a distributable DMG is built. Called by release.yml on a tag
# and by ci.yml on every push to main, so a build handed to a tester and a
# build handed to a user come off the same recipe — the difference is only
# where the artifact ends up.
#
# Everything here exists because a DMG that leaves this machine must be
# self-contained and LGPL-clean: ffmpeg is compiled from source with the
# no-GPL configure line (never Homebrew's build, which is GPLv3 and cannot
# ship under this repo's LICENSE), and every dependency is floored at the
# minimumSystemVersion tauri.conf.json declares. bundle-dylibs.sh fails the
# build if any shipped Mach-O disagrees with either.
name: Build DMG

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the uploaded artifact holding the DMG.
        type: string
        default: platter-dmg
      retention-days:
        description: How long the artifact is kept. Short for dev builds.
        type: number
        default: 14
    secrets:
      # Only a tagged release passes this. A CI build on main still produces
      # the updater archive, unsigned — which the updater refuses, and which is
      # the point: nothing that lands on a user's machine can come from a build
      # nobody tagged.
      TAURI_SIGNING_PRIVATE_KEY:
        description: minisign private key that signs the updater archive.
        required: false
    outputs:
      dmg-name:
        description: Basename of the built DMG.
        value: ${{ jobs.dmg.outputs.dmg-name }}

jobs:
  dmg:
    runs-on: macos-14
    outputs:
      dmg-name: ${{ steps.bundle.outputs.dmg-name }}
    env:
      LIBGPOD_VERSION: "0.8.3"
      LIBGPOD_SHA256: "638a7959d04e95f1e62abad02bd33702e4e8dfef98485ac7d9d50395c37e955d"
      FFMPEG_VERSION: "7.1.1"
      LIBGPOD_PREFIX: ${{ github.workspace }}/.libgpod
      FFMPEG_PREFIX: ${{ github.workspace }}/.ffmpeg-lgpl
      # Every compiled artifact — libgpod, ffmpeg, the Rust binary — floors at
      # the OS the bundle claims to support. Homebrew bottles on a macos-14
      # runner already target 14.0.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build dependencies
        run: |
          brew install glib gdk-pixbuf libplist sqlite pkg-config \
            autoconf automake libtool gettext intltool dylibbundler lame

      - name: Cache libgpod
        id: libgpod-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBGPOD_PREFIX }}
          key: libgpod-${{ env.LIBGPOD_VERSION }}-${{ runner.os }}-${{ runner.arch }}-min14

      - name: Build libgpod from source
        if: steps.libgpod-cache.outputs.cache-hit != 'true'
        # Debian's mirror of the upstream tarball, not SourceForge's own
        # download endpoint: that one now answers 404 with an HTML error page,
        # and its interstitial has no stable URL to pin. Debian carries the
        # identical bytes, so the hash below is the upstream release's — and
        # the reason a third-party mirror is safe to build from at all.
        run: |
          set -euo pipefail
          curl -fsSL "https://deb.debian.org/debian/pool/main/libg/libgpod/libgpod_${LIBGPOD_VERSION}.orig.tar.bz2" -o libgpod.tar.bz2
          echo "${LIBGPOD_SHA256}  libgpod.tar.bz2" | shasum -a 256 --check --status
          tar xf libgpod.tar.bz2
          cd "libgpod-${LIBGPOD_VERSION}"
          # intltool's configure macro shells out to the first perl on PATH,
          # which on a runner is Homebrew's — pulled in by gettext, and without
          # XML::Parser. macOS ships that module with its own perl, so point
          # intltool at that one rather than compiling a CPAN module the build
          # needs for nothing but a configure check.
          if /usr/bin/perl -e 'require XML::Parser' 2>/dev/null; then
            export INTLTOOL_PERL=/usr/bin/perl
          else
            brew install cpanminus
            sudo cpanm --notest XML::Parser
          fi
          # libgpod 0.8.3 asks pkg-config for `libplist`; Homebrew ships
          # libplist 2.x, whose module is named `libplist-2.0`. Only the name
          # moved — the API libgpod uses is the same one, which is what the
          # local dev build linking libplist-2.0.4.dylib demonstrates. A shim
          # .pc that requires the real module closes the gap without patching
          # the tarball, and keeps the version check honest by carrying the
          # real version through.
          shim="$PWD/.pc-shim"
          mkdir -p "$shim"
          {
            echo "Name: libplist"
            echo "Description: Maps libgpod's libplist requirement onto libplist-2.0"
            echo "Version: $(pkg-config --modversion libplist-2.0)"
            echo "Requires: libplist-2.0"
          } > "$shim/libplist.pc"
          export PKG_CONFIG_PATH="$shim:${PKG_CONFIG_PATH:-}"
          ./configure --prefix="$LIBGPOD_PREFIX" \
            --disable-udev --disable-gtk-doc --without-hal --disable-pygobject --disable-mono
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Cache LGPL ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FFMPEG_PREFIX }}
          key: ffmpeg-lgpl-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-${{ runner.arch }}-min14

      - name: Build LGPL ffmpeg from source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        # The canonical LGPL configure line — no GPL
        # components, exactly the codecs/muxers the convert pipeline uses.
        run: |
          set -euo pipefail
          curl -fsSL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" -o ffmpeg.tar.xz
          tar xf ffmpeg.tar.xz
          cd "ffmpeg-${FFMPEG_VERSION}"
          # lame ships no pkg-config file, so ffmpeg probes for it by compiling
          # against the default search paths — which on macOS do not include
          # Homebrew's prefix. Without these, configure fails on
          # `libmp3lame >= 3.98.3 not found` with lame sitting right there.
          # Scoped to lame's own prefix rather than all of Homebrew: this build
          # is meant to link exactly what it declares.
          lame_prefix="$(brew --prefix lame)"
          ./configure \
            --prefix="$FFMPEG_PREFIX" \
            --extra-cflags="-I${lame_prefix}/include" \
            --extra-ldflags="-L${lame_prefix}/lib" \
            --enable-shared --disable-static \
            --disable-gpl --disable-nonfree \
            --disable-doc --disable-ffplay \
            --disable-network --disable-protocols --enable-protocol=file,pipe \
            --disable-encoders --disable-decoders --disable-muxers --disable-demuxers \
            --disable-filters --disable-bsfs --disable-parsers \
            --enable-encoder=alac,aac,flac,pcm_s16le,pcm_s16be,mjpeg \
            --enable-decoder=alac,aac,flac,mp3,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s32le,pcm_f32le,ape,tta,wavpack,shorten,dsd_lsbf,dsd_msbf,dsd_lsbf_planar,dsd_msbf_planar,mlp,truehd,wmalossless,mjpeg,png \
            --enable-muxer=ipod,mp4,mp3,aiff,wav,flac,image2 \
            --enable-demuxer=mov,mp3,flac,wav,aiff,ape,tta,wv,dsf,dff,caf,w64,image2,mjpeg \
            --enable-parser=aac,flac,mpegaudio,png,mjpeg \
            --enable-filter=aresample,aformat,anull,lowpass,scale,null \
            --enable-libmp3lame \
            --enable-audiotoolbox \
            --enable-videotoolbox
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Stage ffmpeg sidecars
        run: ./scripts/stage-ffmpeg.sh "$FFMPEG_PREFIX/bin"

      - name: Build and bundle
        id: bundle
        # SIGN_IDENTITY is unset, so bundle-dylibs.sh signs ad-hoc: the DMG
        # runs anywhere, but macOS calls it "damaged" until the downloader
        # clears the quarantine flag. The release notes and the README both
        # carry that line. Setting a SIGN_IDENTITY here is what replaces it.
        #
        # The key below is a different key entirely, and confusing the two
        # costs an afternoon: SIGN_IDENTITY is Apple's, and decides whether
        # Gatekeeper opens the app at all. This one is minisign's, and decides
        # only whether an already-installed copy accepts the archive as the
        # next version. Neither substitutes for the other.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run bundle
          dmg=$(ls tauri-src/target/release/bundle/dmg/Platter_*.dmg | head -1)
          echo "dmg-name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"

          # Staged flat into one directory before upload. upload-artifact roots
          # a multi-path artifact at the common ancestor of its patterns, so
          # naming the dmg/ and macos/ directories directly would bury the
          # assets one level down and break every consumer's path.
          mkdir -p staged
          cp "$dmg" staged/
          cp tauri-src/target/release/bundle/macos/Platter.app.tar.gz* staged/

      # One artifact, not two: the DMG and the updater archive are the same
      # build, and a release that shipped one from a different run than the
      # other would hand users an update that isn't the download.
      - name: Upload the DMG and the updater archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: staged/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
